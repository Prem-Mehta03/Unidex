[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidex"
version = "0.1.0"
description = "Unified, searchable index of campus department drives (PYQs, notes, slides)."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx2>=2.0",  # talks to Google when signing in (also used by FastAPI's TestClient)
    "itsdangerous>=2.1",  # signs the login cookie
    # zoneinfo has no time-zone data on Windows without this package.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
content = [
    "pypdf>=5.0",  # reads the text layer of PDFs
]
ocr = [
    "pypdf>=5.0",
    "pypdfium2>=4.30",  # draws PDF pages as pictures
    "pillow>=10.0",
    "numpy>=1.26",
    "rapidocr>=3.0",  # OCR that needs nothing but pip (works on Python 3.13)
    "onnxruntime>=1.18",
    "pytesseract>=0.3",  # optional alternative; also needs the Tesseract program
]
dev = [
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unidex.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# T20 forbids print(); D enforces docstrings; G enforces lazy logging arguments.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D", "T20", "G", "LOG", "S", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

# Optional OCR packages ship no type information.
[[tool.mypy.overrides]]
module = ["pytesseract", "rapidocr", "onnxruntime", "pypdfium2"]
ignore_missing_imports = true
