[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidex"
version = "0.1.0"
description = "Unified, searchable index of campus department drives (PYQs, notes, slides)."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    # zoneinfo has no time-zone data on Windows without this package.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unidex.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# T20 forbids print(); D enforces docstrings; G enforces lazy logging arguments.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D", "T20", "G", "LOG", "S", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
